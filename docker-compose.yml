# Whole stack: Nginx (React build) → Express API → PostgreSQL (+ optional Redis cache)
#   cp .env.example .env   # then set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up --build
# App: http://localhost:8080  (API is proxied at /api, health check at /health)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voyage_travel
      POSTGRES_USER: voyage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume.
      - ./travel-agency-backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyage -d voyage_travel"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the API can reach the database.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # pure cache, no persistence needed
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./travel-agency-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      DB_HOST: db
      DB_NAME: voyage_travel
      DB_USER: voyage
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Not published: reached through the web container's /api proxy.

  web:
    build:
      context: ./travel-agency
      args:
        VITE_API_URL: /api                       # same-origin through Nginx → no CORS in this setup
        VITE_DEMO_MODE: "false"          # demo login is only enabled by docker-compose.demo.yml
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
