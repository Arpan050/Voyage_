name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: travel-agency-backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: voyage_travel }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: ci_only_secret_ci_only_secret_ci_only_secret
      DB_HOST: localhost
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: travel-agency-backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Load schema (+ demo admin for the throwaway CI database only)
        run: |
          PGPASSWORD=ci psql -h localhost -U postgres -d voyage_travel -f db/schema.sql
          PGPASSWORD=ci psql -h localhost -U postgres -d voyage_travel -f db/seed_demo_admin.sql
      - name: End-to-end API check
        run: |
          node dist/server.js &
          for i in $(seq 1 20); do curl -sf localhost:5000/health && break; sleep 1; done
          API_URL=http://localhost:5000 npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: travel-agency } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: travel-agency/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build   # runs tsc -b first

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voyage-api ./travel-agency-backend
      - run: docker build -t voyage-web ./travel-agency
